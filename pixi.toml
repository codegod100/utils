[workspace]
name = "utils"
# conda-forge first on purpose: the channel below also carries `elfutils`, and
# under strict channel priority the earlier entry wins, so listing it first
# would shadow conda-forge's.
channels = ["conda-forge", "https://prefix.dev/nandi-testing"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"
ruff = ">=0.17"
# Not on conda-forge; built and published from github.com/nandi-conda/bpftrace.
bpftrace = "0.27.*"

# The tools are stdlib-only and run under the system `python3`, not pixi's: they
# have to work from a plain symlink on PATH. This environment supplies the
# tracer, which `who-killed` hands to the root-side systemd unit by absolute
# path, since root's PATH is not this one.
[tasks]
who-killed = "python who-killed/who-killed"
lint = "ruff check who-killed"
install = "mkdir -p \"$HOME/.local/bin\" && ln -sfn \"$PIXI_PROJECT_ROOT/who-killed/who-killed\" \"$HOME/.local/bin/who-killed\""

# No `format` task on purpose: `ruff format` explodes the compact tables and
# aligned argument lists these tools are written with.
